name: Build and deploy Aseprite

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"
  push:
    branches:
      - master
      - fix

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  check-version:
    name: Check latest Aseprite release
    runs-on: ubuntu-latest

    outputs:
      latest_tag: ${{ steps.version.outputs.latest_tag }}
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Get latest Aseprite release
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          data="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/aseprite/aseprite/releases/latest)"

          latest_tag="$(jq -r '.tag_name' <<< "$data")"

          if [[ -z "$latest_tag" || "$latest_tag" == "null" ]]; then
            echo "Unable to determine latest Aseprite release."
            exit 1
          fi

          echo "Latest Aseprite release: $latest_tag"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.latest_tag }}
        run: |
          set -euo pipefail

          # Manual runs and pushes to "fix" always rebuild.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ||
                "${{ github.ref }}" == "refs/heads/fix" ]]; then
            echo "Forced build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check whether this repository already has a release
          # for the latest Aseprite version.
          status="$(curl --silent --output /dev/null --write-out "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}")"

          if [[ "$status" == "200" ]]; then
            echo "Release $TAG already exists."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          elif [[ "$status" == "404" ]]; then
            echo "Release $TAG does not exist. Building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "GitHub API returned HTTP $status"
            exit 1
          fi

  build-aseprite:
    name: Build Aseprite (${{ matrix.name }})
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            skia_arch: x64

          - os: ubuntu-latest
            name: Linux
            skia_arch: x64

          - os: macos-latest
            name: macOS
            skia_arch: arm64

    steps:
      # ------------------------------------------------------------
      # Download exact Aseprite release including submodules
      # ------------------------------------------------------------

      - name: Checkout Aseprite
        uses: actions/checkout@v7
        with:
          repository: aseprite/aseprite
          ref: ${{ needs.check-version.outputs.latest_tag }}
          submodules: recursive
          path: aseprite

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            g++ \
            clang \
            cmake \
            ninja-build \
            unzip \
            libpixman-1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            zlib1g-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev

      - name: Setup Ninja
        uses: aseprite/get-ninja@main

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      # ------------------------------------------------------------
      # Skia
      #
      # Important:
      # Don't hard-code a Skia release here.
      # Ask the checked-out Aseprite/LAF version which Skia package
      # it expects.
      # ------------------------------------------------------------
      - name: Inspect Skia helper
        working-directory: aseprite
        shell: bash
        run: |
          echo "=== Aseprite ==="
          git describe --tags --always

          echo "=== skia-url.sh ==="
          cat laf/misc/skia-url.sh

      - name: Get Skia URL
        id: skia
        working-directory: aseprite
        shell: bash
        run: |
          set -eo pipefail

          case "${{ runner.os }}" in
            Windows)
              platform="Windows"
              ;;
            Linux)
              platform="Linux"
              ;;
            macOS)
              platform="macOS"
              ;;
            *)
              echo "Unsupported platform: ${{ runner.os }}"
              exit 1
              ;;
          esac

          echo "Platform: $platform"

          skia_url="$(
            bash laf/misc/skia-url.sh "$platform" "${{ matrix.skia_arch }}"
          )"

          skia_url="$(echo "$skia_url" | tail -n 1 | xargs)"
          skia_file="$(basename "$skia_url")"

          if [[ -z "$skia_url" ]]; then
            echo "Failed to determine Skia URL"
            exit 1
          fi

          echo "Skia URL: $skia_url"
          echo "Skia file: $skia_file"

          echo "url=$skia_url" >> "$GITHUB_OUTPUT"
          echo "file=$skia_file" >> "$GITHUB_OUTPUT"

      - name: Cache Skia
        id: skia-cache
        uses: actions/cache@v4
        with:
          path: skia
          key: >-
            skia-${{ runner.os }}-${{ matrix.skia_arch }}-${{
              hashFiles('aseprite/laf/misc/skia-url.sh')
            }}

      - name: Download Skia
        if: steps.skia-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          SKIA_URL: ${{ steps.skia.outputs.url }}
          SKIA_FILE: ${{ steps.skia.outputs.file }}
        run: |
          set -euo pipefail

          curl \
            --fail \
            --show-error \
            --location \
            --retry 3 \
            --ssl-revoke-best-effort \
            -o "$SKIA_FILE" \
            "$SKIA_URL"

          mkdir -p skia
          unzip "$SKIA_FILE" -d skia

      # ------------------------------------------------------------
      # Configure
      # ------------------------------------------------------------

      - name: Configure Aseprite
        working-directory: aseprite
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$(realpath ../skia)" \
            -DSKIA_LIBRARY_DIR="$(realpath ../skia/out/Release-${{ matrix.skia_arch }})"

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build Aseprite
        working-directory: aseprite
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build -- aseprite

      # ------------------------------------------------------------
      # Portable configuration
      # ------------------------------------------------------------

      - name: Enable portable mode
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          echo "# This file is here so Aseprite behaves as a portable program" \
            > aseprite.ini

      # ------------------------------------------------------------
      # Package
      # ------------------------------------------------------------

      - name: Create package
        shell: pwsh
        env:
          TAG: ${{ needs.check-version.outputs.latest_tag }}
          PLATFORM: ${{ matrix.name }}
        run: |
          $archive = "Aseprite-$env:TAG-$env:PLATFORM.zip"

          Compress-Archive `
            -Path "aseprite/build/bin/*" `
            -DestinationPath $archive `
            -CompressionLevel Optimal

          "ASSET=$archive" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      # ------------------------------------------------------------
      # Keep build artifact too
      # ------------------------------------------------------------

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-${{ needs.check-version.outputs.latest_tag }}-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      # ------------------------------------------------------------
      # GitHub Release
      # ------------------------------------------------------------

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check-version.outputs.latest_tag }}
          name: Aseprite ${{ needs.check-version.outputs.latest_tag }}
          draft: true
          prerelease: false
          files: ${{ env.ASSET }}
