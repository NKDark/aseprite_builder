name: Build and deploy Aseprite

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 1 * *"

  push:
    branches:
      - master
      - fix

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  # ============================================================
  # Check latest upstream Aseprite release
  # ============================================================

  check-version:
    name: Check latest Aseprite release
    runs-on: ubuntu-24.04

    outputs:
      latest_tag: ${{ steps.version.outputs.latest_tag }}
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Get latest Aseprite release
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          data="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/aseprite/aseprite/releases/latest
          )"

          latest_tag="$(jq -r '.tag_name' <<< "$data")"

          if [[ -z "$latest_tag" || "$latest_tag" == "null" ]]; then
            echo "Unable to determine latest Aseprite release."
            exit 1
          fi

          echo "Latest Aseprite release: $latest_tag"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Check whether build is required
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.latest_tag }}
        run: |
          set -euo pipefail

          # Manual runs always rebuild.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual build requested."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pushes to fix always rebuild.
          if [[ "${{ github.ref }}" == "refs/heads/fix" ]]; then
            echo "Fix branch build requested."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status="$(
            curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG}"
          )"

          case "$status" in
            200)
              echo "Release $TAG already exists."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "Release $TAG does not exist."
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "GitHub API returned HTTP $status"
              exit 1
              ;;
          esac

  # ============================================================
  # Build Windows / Linux / macOS
  # ============================================================

  build-aseprite:
    name: Build Aseprite (${{ matrix.name }})

    needs:
      - check-version

    if: needs.check-version.outputs.should_build == 'true'

    runs-on: ${{ matrix.os }}

    timeout-minutes: 60

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: windows-latest
            name: Windows
            skia_arch: x64

          - os: ubuntu-24.04
            name: Linux
            skia_arch: x64

          - os: macos-latest
            name: macOS
            skia_arch: arm64

    steps:
      # ----------------------------------------------------------
      # Checkout exact upstream release
      # ----------------------------------------------------------

      - name: Checkout Aseprite
        uses: actions/checkout@v7
        with:
          repository: aseprite/aseprite
          ref: ${{ needs.check-version.outputs.latest_tag }}
          submodules: recursive
          path: aseprite
          persist-credentials: false

      # ----------------------------------------------------------
      # Linux dependencies
      # ----------------------------------------------------------

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y \
            g++ \
            clang \
            cmake \
            ninja-build \
            unzip \
            libpixman-1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            zlib1g-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev

      # ----------------------------------------------------------
      # Ninja / MSVC
      # ----------------------------------------------------------

      - name: Setup Ninja
        uses: aseprite/get-ninja@main

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      # ----------------------------------------------------------
      # Determine Skia package
      # ----------------------------------------------------------

      - name: Get Skia URL
        id: skia
        working-directory: aseprite
        shell: bash
        run: |
          set -euo pipefail

          skia_url="$(bash laf/misc/skia-url.sh Release | xargs)"
          skia_file="$(basename "$skia_url")"

          if [[ -z "$skia_url" ]]; then
            echo "Failed to determine Skia URL."
            exit 1
          fi

          echo "Skia URL:  $skia_url"
          echo "Skia file: $skia_file"

          echo "url=$skia_url" >> "$GITHUB_OUTPUT"
          echo "file=$skia_file" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # Skia cache
      #
      # cache@v5 uses Node.js 24.
      # ----------------------------------------------------------

      - name: Cache Skia
        id: skia-cache
        uses: actions/cache@v5
        with:
          path: skia
          key: skia-${{ runner.os }}-${{ matrix.skia_arch }}-${{ hashFiles('aseprite/laf/misc/skia-tag.txt') }}

      # ----------------------------------------------------------
      # Download Skia on cache miss
      # ----------------------------------------------------------

      - name: Download Skia
        if: steps.skia-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          SKIA_URL: ${{ steps.skia.outputs.url }}
          SKIA_FILE: ${{ steps.skia.outputs.file }}
        run: |
          set -euo pipefail

          echo "Downloading:"
          echo "$SKIA_URL"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --ssl-revoke-best-effort \
            -o "$SKIA_FILE" \
            "$SKIA_URL"

          mkdir -p skia

          unzip \
            -q \
            "$SKIA_FILE" \
            -d skia

          echo "Skia extracted successfully."

      # ----------------------------------------------------------
      # Configure
      # ----------------------------------------------------------

      - name: Configure Aseprite
        working-directory: aseprite
        shell: bash
        run: |
          set -euo pipefail

          # Precompiled Linux Skia requires clang + libstdc++.
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            export CC=clang
            export CXX=clang++
          fi

          cmake_args=(
            -S .
            -B build
            -G Ninja
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
            -DLAF_BACKEND=skia
            -DSKIA_DIR="$(realpath ../skia)"
            -DSKIA_LIBRARY_DIR="$(realpath ../skia/out/Release-${{ matrix.skia_arch }})"
          )

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cmake_args+=(
              "-DCMAKE_CXX_FLAGS:STRING=-stdlib=libstdc++"
              "-DCMAKE_EXE_LINKER_FLAGS:STRING=-stdlib=libstdc++"
            )
          fi

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            cmake_args+=(
              "-DCMAKE_OSX_ARCHITECTURES=arm64"
              "-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
              "-DPNG_ARM_NEON:STRING=on"
            )
          fi

          echo "Configuring Aseprite..."
          cmake "${cmake_args[@]}"

      # ----------------------------------------------------------
      # Build
      # ----------------------------------------------------------

      - name: Build Aseprite
        working-directory: aseprite
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            --build build \
            --target aseprite

      # ----------------------------------------------------------
      # Remove build-only helper binaries
      # ----------------------------------------------------------

      - name: Clean build output
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          rm -f \
            gen \
            gen.exe \
            gen.exe.manifest \
            modp_b64_gen \
            modp_b64_gen.exe \
            modp_b64_gen.exe.manifest

      # ----------------------------------------------------------
      # Windows portable mode only
      #
      # Do NOT create aseprite.ini on macOS.
      # ----------------------------------------------------------

      - name: Enable Windows portable mode
        if: runner.os == 'Windows'
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          echo "# This file is here so Aseprite behaves as a portable program" \
            > aseprite.ini

      # ----------------------------------------------------------
      # Package Windows / Linux
      # ----------------------------------------------------------

      - name: Package Windows or Linux
        if: runner.os != 'macOS'
        shell: pwsh
        env:
          TAG: ${{ needs.check-version.outputs.latest_tag }}
          PLATFORM: ${{ matrix.name }}
        run: |
          $ErrorActionPreference = "Stop"

          $archive = "Aseprite-$env:TAG-$env:PLATFORM.zip"

          if (Test-Path $archive) {
            Remove-Item $archive -Force
          }

          Compress-Archive `
            -Path "aseprite/build/bin/*" `
            -DestinationPath $archive `
            -CompressionLevel Optimal

          if (-not (Test-Path $archive)) {
            throw "Failed to create $archive"
          }

          Write-Host "Created $archive"

          "ASSET=$archive" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      # ----------------------------------------------------------
      # Package macOS
      #
      # IMPORTANT:
      # Only Aseprite.app goes into the ZIP.
      #
      # Do not include:
      #   data/
      #   aseprite
      #   aseprite.ini
      #   icudtl.dat
      #
      # Those resources already exist inside the .app bundle.
      # ----------------------------------------------------------

      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        env:
          TAG: ${{ needs.check-version.outputs.latest_tag }}
        run: |
          set -euo pipefail

          archive="Aseprite-${TAG}-macOS.zip"
          app="aseprite/build/bin/Aseprite.app"

          if [[ ! -d "$app" ]]; then
            echo "Aseprite.app was not generated."
            exit 1
          fi

          rm -f "$archive"

          # ditto is the native macOS tool for packaging .app bundles.
          # It preserves bundle metadata/resource forks better than
          # generic cross-platform ZIP implementations.
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$app" \
            "$archive"

          if [[ ! -f "$archive" ]]; then
            echo "Failed to create $archive."
            exit 1
          fi

          echo "Created $archive"

          echo "ASSET=$archive" >> "$GITHUB_ENV"

      # ----------------------------------------------------------
      # Verify generated package
      # ----------------------------------------------------------

      - name: Verify package
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "${{ env.ASSET }}" ]]; then
            echo "Package does not exist: ${{ env.ASSET }}"
            exit 1
          fi

          echo "Package:"
          ls -lh "${{ env.ASSET }}"

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            echo ""
            echo "macOS package contents:"
            unzip -l "${{ env.ASSET }}" | head -n 40
          fi

      # ----------------------------------------------------------
      # Upload temporary workflow artifact
      #
      # upload-artifact@v7 uses Node.js 24.
      # ----------------------------------------------------------

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Aseprite-${{ needs.check-version.outputs.latest_tag }}-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # GitHub Release
  #
  # This job runs only after all three builds succeed.
  # ============================================================

  release:
    name: Create GitHub Release

    needs:
      - check-version
      - build-aseprite

    if: |
      always() &&
      needs.check-version.outputs.should_build == 'true' &&
      needs.build-aseprite.result == 'success'

    runs-on: ubuntu-24.04

    timeout-minutes: 15

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check-version.outputs.latest_tag }}

    steps:
      # ----------------------------------------------------------
      # Download all three packages
      #
      # download-artifact@v7 uses Node.js 24.
      # ----------------------------------------------------------

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: Aseprite-${{ needs.check-version.outputs.latest_tag }}-*
          path: release-assets
          merge-multiple: true

      # ----------------------------------------------------------
      # Verify exactly three ZIP packages
      # ----------------------------------------------------------

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail

          echo "Release assets:"
          echo ""

          find release-assets \
            -maxdepth 1 \
            -type f \
            -name '*.zip' \
            -print

          count="$(
            find release-assets \
              -maxdepth 1 \
              -type f \
              -name '*.zip' |
            wc -l |
            xargs
          )"

          echo ""
          echo "Found $count ZIP files."

          if [[ "$count" -ne 3 ]]; then
            echo "Expected exactly 3 release packages."
            exit 1
          fi

          expected=(
            "release-assets/Aseprite-${TAG}-Windows.zip"
            "release-assets/Aseprite-${TAG}-Linux.zip"
            "release-assets/Aseprite-${TAG}-macOS.zip"
          )

          for file in "${expected[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing expected release asset:"
              echo "$file"
              exit 1
            fi
          done

          echo ""
          echo "All expected release packages are present."

      # ----------------------------------------------------------
      # Check whether release already exists
      # ----------------------------------------------------------

      - name: Check existing release
        id: release-check
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1; then

            echo "Release $TAG already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"

          else

            echo "Release $TAG does not exist."
            echo "exists=false" >> "$GITHUB_OUTPUT"

          fi

      # ----------------------------------------------------------
      # Create draft release only when necessary
      # ----------------------------------------------------------

      - name: Create draft release
        if: steps.release-check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release Aseprite $TAG" \
            --draft \
            --target master

      # ----------------------------------------------------------
      # Upload / replace assets
      # ----------------------------------------------------------

      - name: Upload release assets
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "$TAG" \
            "release-assets/Aseprite-${TAG}-Windows.zip" \
            "release-assets/Aseprite-${TAG}-Linux.zip" \
            "release-assets/Aseprite-${TAG}-macOS.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      # ----------------------------------------------------------
      # Final information
      # ----------------------------------------------------------

      - name: Show release information
        shell: bash
        run: |
          set -euo pipefail

          echo "Release completed:"
          echo ""

          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY"
